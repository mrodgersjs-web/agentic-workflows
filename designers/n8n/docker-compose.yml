name: ad-n8n
# n8n self-hosted (Sustainable Use License 1.1 - internal RIG use OK; not offered as a multi-tenant SaaS)
# Data: /Volumes/OWC-DOCKER/agentic-designers/n8n  (n8n home: sqlite + binaries + encryption key file)
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT}:${N8N_PORT}"
    environment:
      - N8N_PORT=${N8N_PORT}
      - N8N_HOST=0.0.0.0
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://${AD_TAILNET_IP}:${N8N_PORT}/
      - GENERIC_TIMEZONE=America/Denver
      - TZ=America/Denver
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=720
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_RELEASE_NOTIFICATIONS_OFF=true
      - QUEUE_BULL_REDIS_DISABLED=true
    volumes:
      - /Volumes/OWC-DOCKER/agentic-designers/n8n:/home/node/.n8n
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
